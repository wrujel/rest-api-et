<div class="auth-hero" aria-hidden="true">
  <svg class="auth-hero-art" viewBox="0 0 800 1100" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="auth-hero-sky" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#172033" />
        <stop offset="40%" stop-color="#0c1320" />
        <stop offset="100%" stop-color="#05080f" />
      </linearGradient>
      <radialGradient id="auth-hero-glow" cx="68%" cy="32%" r="60%">
        <stop offset="0%" stop-color="rgba(135, 190, 245, 0.28)" />
        <stop offset="60%" stop-color="rgba(135, 190, 245, 0.06)" />
        <stop offset="100%" stop-color="rgba(135, 190, 245, 0)" />
      </radialGradient>
      <linearGradient id="auth-hero-haze" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="rgba(170, 200, 235, 0)" />
        <stop offset="50%" stop-color="rgba(170, 200, 235, 0.13)" />
        <stop offset="100%" stop-color="rgba(170, 200, 235, 0)" />
      </linearGradient>
      <radialGradient id="auth-hero-moon" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="rgba(255, 255, 255, 0.85)" />
        <stop offset="35%" stop-color="rgba(225, 238, 255, 0.5)" />
        <stop offset="70%" stop-color="rgba(225, 238, 255, 0.08)" />
        <stop offset="100%" stop-color="rgba(225, 238, 255, 0)" />
      </radialGradient>
      <linearGradient id="auth-hero-vignette" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="rgba(0, 0, 0, 0)" />
        <stop offset="100%" stop-color="rgba(0, 0, 0, 0.45)" />
      </linearGradient>
    </defs>

    <rect width="800" height="1100" fill="url(#auth-hero-sky)" />
    <rect width="800" height="1100" fill="url(#auth-hero-glow)" />

    <!-- Distant moon -->
    <circle cx="640" cy="220" r="42" fill="url(#auth-hero-moon)" opacity="0.9" />
    <circle cx="640" cy="220" r="14" fill="rgba(255, 255, 255, 0.92)" />

    <!-- Stars -->
    <g fill="#e8effb">
      <circle cx="120" cy="140" r="0.9" opacity="0.7" />
      <circle cx="240" cy="90" r="0.7" opacity="0.55" />
      <circle cx="320" cy="190" r="1" opacity="0.8" />
      <circle cx="430" cy="120" r="0.6" opacity="0.4" />
      <circle cx="700" cy="110" r="0.8" opacity="0.55" />
      <circle cx="760" cy="200" r="0.7" opacity="0.5" />
      <circle cx="160" cy="260" r="0.5" opacity="0.4" />
    </g>

    <!-- Atmospheric haze band -->
    <rect x="0" y="560" width="800" height="200" fill="url(#auth-hero-haze)" />

    <!-- Far ridge (smooth, distant) -->
    <path
      d="M0,615
         C 110,560 200,615 295,575
         S 470,540 565,580
         S 720,560 800,540
         L 800,1100 L 0,1100 Z"
      fill="rgba(82, 105, 138, 0.42)" />

    <!-- Upper-mid ridge -->
    <path
      d="M0,710
         C 90,640 200,710 305,650
         S 470,615 580,665
         S 720,635 800,605
         L 800,1100 L 0,1100 Z"
      fill="rgba(58, 78, 110, 0.7)" />

    <!-- Mid ridge -->
    <path
      d="M0,800
         C 100,720 220,810 320,740
         S 470,710 590,765
         S 730,720 800,690
         L 800,1100 L 0,1100 Z"
      fill="rgba(34, 49, 72, 0.92)" />

    <!-- Front ridge (sharper, closer) -->
    <path
      d="M0,900
         C 80,820 200,900 320,830
         C 410,775 510,810 605,860
         C 685,895 740,855 800,825
         L 800,1100 L 0,1100 Z"
      fill="rgba(10, 16, 26, 0.98)" />

    <!-- Pine silhouettes on the right edge -->
    <g fill="#04080f">
      <path d="M715,720 l5,11 l-4,0 l7,14 l-6,0 l8,16 l-7,0 l9,18 l-19,0 l9,-18 l-7,0 l8,-16 l-6,0 l7,-14 l-4,0 z" />
      <path d="M755,750 l4,9 l-3,0 l6,12 l-5,0 l7,14 l-6,0 l8,16 l-17,0 l8,-16 l-6,0 l7,-14 l-5,0 l6,-12 l-3,0 z" />
      <path d="M690,790 l5,10 l-4,0 l7,13 l-6,0 l8,16 l-7,0 l8,16 l-17,0 l8,-16 l-7,0 l8,-16 l-6,0 l7,-13 l-4,0 z" />
      <path d="M740,830 l4,9 l-3,0 l6,12 l-5,0 l7,14 l-6,0 l8,16 l-17,0 l8,-16 l-6,0 l7,-14 l-5,0 l6,-12 l-3,0 z" />
    </g>

    <!-- Dotted route curve -->
    <path
      d="M210,90 C 360,210 280,420 410,540 S 540,820 250,1020"
      fill="none"
      stroke="rgba(220, 236, 255, 0.36)"
      stroke-width="2"
      stroke-dasharray="2 9"
      stroke-linecap="round" />

    <!-- Bottom vignette -->
    <rect width="800" height="1100" fill="url(#auth-hero-vignette)" />
  </svg>

  <span class="auth-hero-mark">
    <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor">
      <path d="M5 26 L16 4 L27 26 L23.5 26 L21.4 21.5 L10.6 21.5 L8.5 26 Z M16 11 L12 19 L20 19 Z" />
      <circle cx="22" cy="24.5" r="1.6" />
    </svg>
  </span>
</div>
