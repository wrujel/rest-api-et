<div class="auth-hero" aria-hidden="true">
  <svg class="auth-hero-art" viewBox="0 0 800 1100" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="auth-hero-sky" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" style="stop-color: var(--auth-hero-sky-top)" />
        <stop offset="55%" style="stop-color: var(--auth-hero-sky-mid)" />
        <stop offset="100%" style="stop-color: var(--auth-hero-sky-bottom)" />
      </linearGradient>
      <radialGradient id="auth-hero-glow" cx="68%" cy="32%" r="60%">
        <stop offset="0%" style="stop-color: var(--auth-hero-glow)" />
        <stop offset="60%" style="stop-color: var(--auth-hero-glow-mid)" />
        <stop offset="100%" style="stop-color: var(--auth-hero-glow-fade)" />
      </radialGradient>
      <linearGradient id="auth-hero-haze" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" style="stop-color: var(--auth-hero-haze-fade)" />
        <stop offset="50%" style="stop-color: var(--auth-hero-haze)" />
        <stop offset="100%" style="stop-color: var(--auth-hero-haze-fade)" />
      </linearGradient>
      <radialGradient id="auth-hero-celestial" cx="50%" cy="50%" r="50%">
        <stop offset="0%" style="stop-color: var(--auth-hero-celestial-1)" />
        <stop offset="35%" style="stop-color: var(--auth-hero-celestial-2)" />
        <stop offset="70%" style="stop-color: var(--auth-hero-celestial-3)" />
        <stop offset="100%" style="stop-color: var(--auth-hero-celestial-4)" />
      </radialGradient>
      <linearGradient id="auth-hero-vignette" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" style="stop-color: var(--auth-hero-vignette-1)" />
        <stop offset="100%" style="stop-color: var(--auth-hero-vignette-2)" />
      </linearGradient>
    </defs>

    <rect width="800" height="1100" fill="url(#auth-hero-sky)" />
    <rect width="800" height="1100" fill="url(#auth-hero-glow)" />

    <!-- Sun / moon -->
    <circle cx="640" cy="220" r="42" fill="url(#auth-hero-celestial)" opacity="0.92" />
    <circle cx="640" cy="220" r="14" style="fill: var(--auth-hero-celestial-core)" />

    <!-- Stars (hidden in day mode via opacity) -->
    <g fill="#e8effb" style="opacity: var(--auth-hero-stars-opacity)">
      <circle cx="120" cy="140" r="0.9" opacity="0.7" />
      <circle cx="240" cy="90" r="0.7" opacity="0.55" />
      <circle cx="320" cy="190" r="1" opacity="0.8" />
      <circle cx="430" cy="120" r="0.6" opacity="0.4" />
      <circle cx="700" cy="110" r="0.8" opacity="0.55" />
      <circle cx="760" cy="200" r="0.7" opacity="0.5" />
      <circle cx="160" cy="260" r="0.5" opacity="0.4" />
    </g>

    <!-- Birds (visible in day, hidden at night via opacity) -->
    <g fill="none" stroke-linecap="round" stroke-width="1.6" style="stroke: var(--auth-hero-pine); opacity: var(--auth-hero-birds-opacity)">
      <path d="M260,210 q 8,-7 16,0 q 8,-7 16,0" />
      <path d="M340,170 q 6,-5 12,0 q 6,-5 12,0" />
    </g>

    <!-- Atmospheric haze band -->
    <rect x="0" y="560" width="800" height="200" fill="url(#auth-hero-haze)" />

    <!-- Far ridge (smooth, distant) -->
    <path
      d="M0,615
         C 110,560 200,615 295,575
         S 470,540 565,580
         S 720,560 800,540
         L 800,1100 L 0,1100 Z"
      style="fill: var(--auth-hero-far-ridge)" />

    <!-- Upper-mid ridge -->
    <path
      d="M0,710
         C 90,640 200,710 305,650
         S 470,615 580,665
         S 720,635 800,605
         L 800,1100 L 0,1100 Z"
      style="fill: var(--auth-hero-mid-ridge)" />

    <!-- Mid ridge -->
    <path
      d="M0,800
         C 100,720 220,810 320,740
         S 470,710 590,765
         S 730,720 800,690
         L 800,1100 L 0,1100 Z"
      style="fill: var(--auth-hero-near-ridge)" />

    <!-- Front ridge (sharper, closer) -->
    <path
      d="M0,900
         C 80,820 200,900 320,830
         C 410,775 510,810 605,860
         C 685,895 740,855 800,825
         L 800,1100 L 0,1100 Z"
      style="fill: var(--auth-hero-front-ridge)" />

    <!-- Pine silhouettes on the right edge -->
    <g style="fill: var(--auth-hero-pine)">
      <path d="M715,720 l5,11 l-4,0 l7,14 l-6,0 l8,16 l-7,0 l9,18 l-19,0 l9,-18 l-7,0 l8,-16 l-6,0 l7,-14 l-4,0 z" />
      <path d="M755,750 l4,9 l-3,0 l6,12 l-5,0 l7,14 l-6,0 l8,16 l-17,0 l8,-16 l-6,0 l7,-14 l-5,0 l6,-12 l-3,0 z" />
      <path d="M690,790 l5,10 l-4,0 l7,13 l-6,0 l8,16 l-7,0 l8,16 l-17,0 l8,-16 l-7,0 l8,-16 l-6,0 l7,-13 l-4,0 z" />
      <path d="M740,830 l4,9 l-3,0 l6,12 l-5,0 l7,14 l-6,0 l8,16 l-17,0 l8,-16 l-6,0 l7,-14 l-5,0 l6,-12 l-3,0 z" />
    </g>

    <!-- Dotted route curve -->
    <path
      d="M210,90 C 360,210 280,420 410,540 S 540,820 250,1020"
      fill="none"
      style="stroke: var(--auth-hero-curve)"
      stroke-width="2"
      stroke-dasharray="2 9"
      stroke-linecap="round" />

    <!-- Bottom vignette -->
    <rect width="800" height="1100" fill="url(#auth-hero-vignette)" />
  </svg>

  <span class="auth-hero-mark">
    <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor">
      <path d="M5 26 L16 4 L27 26 L23.5 26 L21.4 21.5 L10.6 21.5 L8.5 26 Z M16 11 L12 19 L20 19 Z" />
      <circle cx="22" cy="24.5" r="1.6" />
    </svg>
  </span>
</div>
