<section class="not-found">
  <div class="not-found-card">
    <span class="not-found-emoji" aria-hidden="true">
      <mat-icon>explore_off</mat-icon>
    </span>
    <p class="not-found-eyebrow">404 &middot; page not found</p>
    <h1 class="not-found-title">We can't find that page.</h1>
    <p class="not-found-sub">
      The link may be broken, or the page may have moved. Let's get you home.
    </p>
    <a mat-flat-button color="primary" routerLink="/home">
      <mat-icon>home</mat-icon>
      <span>Back to home</span>
    </a>
  </div>
</section>
