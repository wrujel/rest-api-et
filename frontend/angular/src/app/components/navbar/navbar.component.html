<nav class="app-bar">
  <a class="brand" routerLink="/docs">
    <span class="brand-mark" aria-hidden="true">
      <mat-icon>bolt</mat-icon>
    </span>
    <span>API Dashboard</span>
  </a>

  <span class="spacer"></span>

  <span class="nav-links">
    <a
      class="nav-link"
      routerLink="/docs"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: false }"
    >API Docs</a>
    @if (auth.isLoggedIn()) {
      <a
        class="nav-link"
        routerLink="/home"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: false }"
      >Products</a>
    }
  </span>

  <button
    type="button"
    mat-icon-button
    class="theme-toggle"
    [matTooltip]="themeLabel()"
    matTooltipPosition="below"
    (click)="toggleTheme()"
    [attr.aria-label]="themeLabel()"
  >
    <mat-icon>{{ themeIcon() }}</mat-icon>
  </button>

  @if (auth.isLoggedIn()) {
    <button class="user-chip" type="button" [matMenuTriggerFor]="menu">
      <span class="user-avatar" aria-hidden="true">{{ auth.initial() }}</span>
      <span class="user-email">{{ auth.userEmail() }}</span>
      <mat-icon aria-hidden="true">expand_more</mat-icon>
    </button>
    <mat-menu #menu="matMenu" xPosition="before">
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Sign out</span>
      </button>
    </mat-menu>
  } @else {
    <span class="nav-links">
      <a class="nav-link" routerLink="/login" routerLinkActive="is-active">Sign in</a>
      <a class="nav-link" routerLink="/register" routerLinkActive="is-active">Register</a>
    </span>
  }
</nav>
